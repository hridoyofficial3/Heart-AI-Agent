plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'org.heart.dipanwita'
    compileSdk 34

    defaultConfig {
        applicationId "org.heart.dipanwita"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding "UTF-8"
    }
}

chaquopy {
    defaultConfig {
        version "3.11"
        buildPython "python3"
        pip {
            install "requests"
            install "pypdf"
        }
    }
}
