name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
      - name: Show real error in Summary
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build.log > clean.log
          {
            echo '### What went wrong'
            echo '```'
            grep -n -A 14 -e 'What went wrong' -e 'FAILURE:' clean.log | head -n 50 | cut -c1-300
            echo '```'
            echo '### Error lines'
            echo '```'
            grep -inE 'error|exception|not found|could not|unsupported|incompatible|failed' clean.log | tail -n 30 | cut -c1-300
            echo '```'
            echo '### Last 50 lines'
            echo '```'
            tail -n 50 clean.log | cut -c1-300
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dipanwita-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
